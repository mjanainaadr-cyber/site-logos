<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railarts | Entrar</title><link rel="stylesheet" href="estilo.css"></head><body class="fundo-conta"><main class="conta-card"><a href="index.html" class="voltar">← Voltar para a loja</a><img src="imagens/Design sem nome (4).png" class="conta-logo" alt="Railarts"><div id="loginBox"><span class="tag-produtos">ÁREA DO CLIENTE</span><h1>Entrar na sua conta</h1><p>Faça login para acompanhar seus pedidos e deixar suas compras mais organizadas.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="Seu e-mail" required><input id="loginSenha" type="password" placeholder="Sua senha" required><button class="btn-amarelo" type="submit">ENTRAR</button></form><p class="form-msg" id="loginMsg"></p><button class="link-btn" onclick="mostrarCadastro()">Ainda não tenho conta</button></div><div id="cadastroBox" style="display:none"><span class="tag-produtos">NOVO CLIENTE</span><h1>Criar conta</h1><form id="cadastroForm"><input id="cadNome" placeholder="Nome completo" required><input id="cadEmail" type="email" placeholder="Seu e-mail" required><input id="cadSenha" type="password" minlength="4" placeholder="Crie uma senha" required><button class="btn-amarelo" type="submit">CRIAR CONTA</button></form><p class="form-msg" id="cadMsg"></p><button class="link-btn" onclick="mostrarLogin()">Já tenho conta</button></div></main><script src="loja.js"></script><script>function mostrarCadastro(){loginBox.style.display='none';cadastroBox.style.display='block'}function mostrarLogin(){cadastroBox.style.display='none';loginBox.style.display='block'}loginForm.onsubmit=e=>{e.preventDefault();const r=loginUser(loginEmail.value,loginSenha.value);if(r.ok)location.href='conta.html';else loginMsg.textContent=r.msg};cadastroForm.onsubmit=e=>{e.preventDefault();const r=registerUser(cadNome.value,cadEmail.value,cadSenha.value);if(r.ok)location.href='conta.html';else cadMsg.textContent=r.msg};</script></body></html>
