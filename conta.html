<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railarts | Minha conta</title><link rel="stylesheet" href="estilo.css"></head><body class="fundo-conta"><main class="conta-card conta-larga"><a href="index.html" class="voltar">← Voltar para a loja</a><div id="contaConteudo"></div></main><script src="loja.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=getCurrentUser();if(!u){location.href='login.html';return}const orders=JSON.parse(localStorage.getItem(RAILARTS_ORDERS_KEY)||'[]').filter(o=>o.userId===u.id);contaConteudo.innerHTML=`<span class="tag-produtos">MINHA CONTA</span><h1>Olá, ${u.name}!</h1><p>${u.email}</p><div class="conta-acoes"><a class="btn-amarelo" href="produtos.html">CONTINUAR COMPRANDO</a><button class="btn-preto" onclick="logoutUser()">SAIR DA CONTA</button></div><h2>Meus pedidos</h2><div class="historico">${orders.length?orders.reverse().map(o=>`<div class="pedido-card"><b>Pedido #${o.id}</b><small>${new Date(o.date).toLocaleString('pt-BR')}</small><p>${o.items.map(i=>`${i.qtd}x ${i.nome}`).join(' • ')}</p></div>`).join(''):'<p>Você ainda não possui pedidos registrados.</p>'}</div>`})</script></body></html>
