<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railarts | Painel</title><link rel="stylesheet" href="estilo.css"></head><body><main class="admin"><div class="admin-head"><div><span class="tag-produtos">RAILARTS</span><h1>Painel de vendas</h1><p>Visão dos pedidos registrados neste navegador.</p></div><a href="index.html" class="btn-preto">Voltar à loja</a></div><div class="stats" id="stats"></div><section class="ranking"><h2>🏆 Produtos mais comprados</h2><div id="ranking"></div></section><section class="pedidos-admin"><h2>Pedidos recentes</h2><div id="pedidos"></div></section></main><script src="loja.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const orders=JSON.parse(localStorage.getItem(RAILARTS_ORDERS_KEY)||'[]');const users=JSON.parse(localStorage.getItem(RAILARTS_USERS_KEY)||'[]');const map={};let itens=0;orders.forEach(o=>o.items.forEach(i=>{itens+=i.qtd;map[i.nome]=(map[i.nome]||0)+i.qtd}));const rank=Object.entries(map).sort((a,b)=>b[1]-a[1]);stats.innerHTML=`<div><b>${orders.length}</b><span>Pedidos</span></div><div><b>${itens}</b><span>Itens vendidos</span></div><div><b>${users.length}</b><span>Clientes</span></div><div><b>${rank.length?rank[0][1]:0}</b><span>Unidades do campeão</span></div>`;ranking.innerHTML=rank.length?rank.map((r,i)=>`<div class="rank-item"><strong>${i+1}º</strong><span>${r[0]}</span><b>${r[1]} un.</b></div>`).join(''):'<p>Ainda não há pedidos registrados.</p>';pedidos.innerHTML=orders.slice().reverse().map(o=>`<div class="pedido-admin"><b>#${o.id}</b> — ${o.customer} — ${new Date(o.date).toLocaleString('pt-BR')}<br><span>${o.items.map(i=>`${i.qtd}x ${i.nome}`).join(' • ')}</span></div>`).join('')||'<p>Nenhum pedido.</p>'})</script></body></html>
